```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boston House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f9;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        .full-width {
            grid-column: span 2;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .prediction {
            margin-top: 25px;
            padding: 18px;
            background: #e8f5e9;
            border: 1px solid #81c784;
            border-radius: 6px;
            text-align: center;
            color: #2e7d32;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Boston House Price Prediction</h1>

    <p class="subtitle">
        Enter the property information to predict the house price.
    </p>

    <form action="/predict" method="POST">

        <div class="form-grid">

            <!-- CRIM -->
            <div class="form-group">
                <label for="CRIM">CRIM</label>
                <input
                    type="number"
                    step="any"
                    name="CRIM"
                    id="CRIM"
                    placeholder="Crime rate"
                    required
                >
            </div>

            <!-- ZN -->
            <div class="form-group">
                <label for="ZN">ZN</label>
                <input
                    type="number"
                    step="any"
                    name="ZN"
                    id="ZN"
                    placeholder="Residential land zone"
                    required
                >
            </div>

            <!-- INDUS -->
            <div class="form-group">
                <label for="INDUS">INDUS</label>
                <input
                    type="number"
                    step="any"
                    name="INDUS"
                    id="INDUS"
                    placeholder="Non-retail business area"
                    required
                >
            </div>

            <!-- CHAS -->
            <div class="form-group">
                <label for="CHAS">CHAS</label>
                <select name="CHAS" id="CHAS" required>
                    <option value="0">0 - Not near Charles River</option>
                    <option value="1">1 - Near Charles River</option>
                </select>
            </div>

            <!-- NOX -->
            <div class="form-group">
                <label for="NOX">NOX</label>
                <input
                    type="number"
                    step="any"
                    name="NOX"
                    id="NOX"
                    placeholder="Nitric oxide concentration"
                    required
                >
            </div>

            <!-- RM -->
            <div class="form-group">
                <label for="RM">RM</label>
                <input
                    type="number"
                    step="any"
                    name="RM"
                    id="RM"
                    placeholder="Average number of rooms"
                    required
                >
            </div>

            <!-- AGE -->
            <div class="form-group">
                <label for="AGE">AGE</label>
                <input
                    type="number"
                    step="any"
                    name="AGE"
                    id="AGE"
                    placeholder="Age of buildings (%)"
                    required
                >
            </div>

            <!-- DIS -->
            <div class="form-group">
                <label for="DIS">DIS</label>
                <input
                    type="number"
                    step="any"
                    name="DIS"
                    id="DIS"
                    placeholder="Distance to employment centers"
                    required
                >
            </div>

            <!-- RAD -->
            <div class="form-group">
                <label for="RAD">RAD</label>
                <select name="RAD" id="RAD" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="24">24</option>
                </select>
            </div>

            <!-- TAX -->
            <div class="form-group">
                <label for="TAX">TAX</label>
                <input
                    type="number"
                    step="any"
                    name="TAX"
                    id="TAX"
                    placeholder="Property tax rate"
                    required
                >
            </div>

            <!-- PTRATIO -->
            <div class="form-group">
                <label for="PTRATIO">PTRATIO</label>
                <input
                    type="number"
                    step="any"
                    name="PTRATIO"
                    id="PTRATIO"
                    placeholder="Pupil-teacher ratio"
                    required
                >
            </div>

            <!-- B -->
            <div class="form-group">
                <label for="B">B</label>
                <input
                    type="number"
                    step="any"
                    name="B"
                    id="B"
                    placeholder="Black population index"
                    required
                >
            </div>

            <!-- LSTAT -->
            <div class="form-group">
                <label for="LSTAT">LSTAT</label>
                <input
                    type="number"
                    step="any"
                    name="LSTAT"
                    id="LSTAT"
                    placeholder="Lower status population (%)"
                    required
                >
            </div>

        </div>

        <button type="submit">
            Predict House Price
        </button>

    </form>

    {% if prediction_text %}
        <div class="prediction">
            {{ prediction_text }}
        </div>
    {% endif %}

</div>

</body>
</html>
```
